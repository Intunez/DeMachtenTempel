<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>De Machtentempel · Afbeeldingeneditie</title><style>
*{box-sizing:border-box}body{margin:0;background:#07131b;color:#f6e5bb;font:16px system-ui}header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#08131a;gap:12px;flex-wrap:wrap}h1{font:small-caps 28px Georgia;margin:0;color:#f5c878}a{color:#e9d29b}button{cursor:pointer;background:#173044;color:#ffe4a2;border:1px solid #b78d4d;border-radius:10px;padding:10px 13px}button:hover{background:#28506a}button:disabled{opacity:.5}main{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 70px)}aside{background:#0d202a;padding:15px;border-right:1px solid #8d713d}aside label{display:block;margin:12px 0}.scene{min-height:640px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 60% 25%,#46606d,#17232c 60%,#09131c);background-size:cover;background-position:center}.scene:before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 30%,#08131de6 100%);pointer-events:none}.top{position:relative;padding:20px;background:#08131ac7;display:flex;justify-content:space-between}.hero{position:absolute;bottom:170px;left:5%;width:clamp(100px,17vw,250px);max-height:48%;object-fit:contain;filter:drop-shadow(0 12px 15px #000);display:none}.quiz{position:relative;z-index:2;margin:120px auto 35px;max-width:800px;background:#0a1924eb;border:1px solid #d0a35a;border-radius:18px;padding:22px;text-align:center}.quiz h2{font:28px Georgia}.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:15px}.tile{font-size:18px}.picked{min-height:48px;padding:10px;border:1px dashed #9b875a;border-radius:10px}.status{margin:14px;text-align:center;color:#ffdd93}.teams{display:grid;gap:9px}.teams button{display:flex;align-items:center;gap:10px;text-align:left}.teams img{height:48px;width:48px;object-fit:cover;border-radius:50%}.selected{outline:3px solid #ffd06e}.race{position:relative;background:#0b1b27df;margin:22px auto;padding:20px;max-width:1100px;border:1px solid #d7ae69;border-radius:14px}.lane{display:grid;grid-template-columns:85px repeat(16,minmax(18px,1fr));gap:3px;align-items:center;margin:6px 0}.sq{background:#1e3640;border:1px solid #977d4c;min-height:35px;display:grid;place-items:center;font-size:11px}.sq.active{background:#9e752a;color:#fff}.sq img{max-height:35px;max-width:100%}.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.upload{font-size:12px;color:#c9b48c}.win{font:35px Georgia;text-align:center;padding:50px;background:#0b1d29e8;position:relative}#notice{font-size:12px;color:#edcf96}input[type=file]{max-width:100%}@media(max-width:750px){main{grid-template-columns:1fr}aside{border:0}.teams{grid-template-columns:repeat(3,1fr)}.quiz{margin:80px 8px 20px}.scene{min-height:650px}.lane{grid-template-columns:45px repeat(16,minmax(14px,1fr))}.sq{font-size:9px}}
</style><header><h1>De Machtentempel · Afbeeldingeneditie</h1><div class="row"><a href="../wereld3d.html">↗ Vorige 3D-versie</a><button id="reset">Nieuw spel</button></div></header>
<main><aside><h3>Teams <span id="count"></span></h3><div class="teams" id="teams"></div><button id="add">+ Team</button><p class="upload">Laad eenmalig de goedgekeurde fantasyafbeeldingen en helden uit de uitgepakte ZIP-map om ze online te zien.</p><input id="images" type="file" accept="image/*" multiple><p class="upload">Eigen muziek (alleen op dit individuele scherm)</p><input id="audioFile" type="file" accept="audio/*"><div class="row"><button id="audioToggle">♫ Muziek aan</button><input id="volume" type="range" min="0" max="100" value="55"></div><p id="notice"></p></aside>
<div class="scene" id="scene"><div class="top"><strong id="chapter">Brug der Machten</strong><span id="counter"></span></div><img class="hero" id="hero"><section class="quiz" id="quiz"><h2 id="heading"></h2><div id="question"></div><div id="picked" class="picked"></div><div id="tiles" class="tiles"></div><button id="submit">Antwoord indienen</button><div class="status" id="feedback"></div></section><section id="race" class="race hidden"></section><section id="win" class="win hidden">🏆 DE SCHATKAMER IS GEOPEND!<p id="winner"></p></section><div class="row" style="position:relative;justify-content:center;padding:12px"><button id="prev">← Vorig avontuur</button><button id="next">Volgend avontuur →</button><button id="final">⚡ Finale starten</button></div></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const names=['Brug der Machten','De waterval van vergeten machten','De drakenproef van de brandende exponenten','Het portaal van de oneindigheid','De Exponentiële Kristalgrot','Schatkamer der Machten','Finale: race naar de schatkamer'];
const scenes=['01_Brug_der_Machten_goedgekeurd.png','02_Waterval_vergeten_machten_goedgekeurd.png','03_Drakenproef_brandende_exponenten_goedgekeurd.png','04_Portaal_van_de_oneindigheid_goedgekeurd.png','05_Exponentiele_Kristalgrot_goedgekeurd.png','06_Schatkamer_der_Machten_goedgekeurd.png','07_Finale_race_visuele_referentie.png'];
const art={};let questions=[],finalQs=[],teams=[],active=0,final=false,winner=-1,music=new Audio(),draft=[],qnum=0;
music.loop=true;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
function makeTeam(i){return {id:i,name:'Team '+(i+1),avatar:i,solved:0,points:0,pos:1,tries:0}}
function save(){localStorage.setItem('machtentempel-art-online',JSON.stringify({teams,active,final,winner}))}
function reset(){teams=[makeTeam(0),makeTeam(1),makeTeam(2)];active=0;final=false;winner=-1;draft=[];save();render()}
function stage(t){return Math.min(5,Math.floor(t.solved/3))}
function artUrl(name){return art[name]||name}
function updateArt(){const t=teams[active];$('scene').style.backgroundImage='linear-gradient(#09131b40,#09131b77),url("'+artUrl(scenes[final?6:stage(t)])+'")';const h='held_'+String(t.avatar+1).padStart(2,'0')+'.png';$('hero').src=artUrl(h);$('hero').style.display=art[h]?'block':'none'}
function render(){if(!teams.length)return;const t=teams[active];$('count').textContent=teams.length+'/13';$('teams').innerHTML=teams.map((x,i)=>'<button data-i="'+i+'" class="'+(i===active?'selected':'')+'">'+(art['held_'+String(x.avatar+1).padStart(2,'0')+'.png']?'<img src="'+artUrl('held_'+String(x.avatar+1).padStart(2,'0')+'.png')+'">':'⚔')+escape(x.name)+'</button>').join('');$('teams').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=+b.dataset.i;draft=[];render()});$('chapter').textContent=names[final?6:stage(t)];$('counter').textContent=final?'FINALE · '+teams.length+' banen':'AVONTUUR '+(stage(t)+1)+'/6';updateArt();$('race').classList.toggle('hidden',!final);$('win').classList.toggle('hidden',winner<0);$('quiz').classList.toggle('hidden',winner>=0);if(winner>=0){$('winner').textContent=teams[winner].name;return}renderQuestion();if(final)renderRace()}
function renderQuestion(){const t=teams[active];$('feedback').textContent='';if(final){const q=finalQs[t.tries%finalQs.length];$('heading').textContent='Race naar de schatkamer · vak '+t.pos+'/16';$('question').textContent=q.q;$('picked').innerHTML='';const choices=finalChoices(q);$('tiles').innerHTML=choices.map((x,i)=>'<button class="tile" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+escape(x)+'</button>').join('');$('tiles').querySelectorAll('button').forEach(b=>b.onclick=()=>answerFinal(+b.dataset.i));$('submit').classList.add('hidden');return}
const q=questions[t.solved%questions.length];$('heading').textContent=q.t;$('question').textContent=q.q;$('submit').classList.remove('hidden');$('picked').innerHTML=draft.map((i,j)=>'<button class="tile" data-j="'+j+'">'+escape(q.tokens[i])+'</button>').join('');$('picked').querySelectorAll('button').forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.j,1);renderQuestion()});$('tiles').innerHTML=q.tokens.map((x,i)=>'<button class="tile" data-i="'+i+'" '+(draft.includes(i)?'disabled':'')+'>'+escape(x)+'</button>').join('');$('tiles').querySelectorAll('button').forEach(b=>b.onclick=()=>{draft.push(+b.dataset.i);renderQuestion()})}
function finalChoices(q){const answer=q.a;const wrong1=q.q.replace(/[()]/g,'').replace(/\^/g,'');return [answer,wrong1,answer+'²']}
function answerFinal(i){const t=teams[active],q=finalQs[t.tries%finalQs.length];if(i===0){t.pos=Math.min(16,t.pos+1);t.points+=50;if(t.pos===16)winner=active}else{t.pos=Math.max(1,t.pos-1)}t.tries++;save();render();$('feedback').textContent=i===0?'✓ Juist: een vak vooruit':'✕ Fout: een vak achteruit'}
function submit(){if(final)return;const t=teams[active],q=questions[t.solved%questions.length];const good=JSON.stringify(draft)===JSON.stringify(q.answer);if(good){t.solved++;t.points+=100}draft=[];save();render();$('feedback').textContent=good?'✓ Juist! +100 punten':'✕ Probeer opnieuw'}
function renderRace(){$('race').innerHTML='<h2>Race · 16 vakken per team</h2>'+teams.map((t,i)=>'<div class="lane"><b>'+escape(t.name)+'</b>'+Array.from({length:16},(_,j)=>'<div class="sq '+(t.pos===j+1?'active':'')+'">'+(t.pos===j+1?'♟':j+1)+'</div>').join('')+'</div>').join('')}
$('submit').onclick=submit;$('add').onclick=()=>{if(teams.length>=13)return;teams.push(makeTeam(teams.length));save();render()};$('reset').onclick=()=>{if(confirm('Nieuw spel beginnen?'))reset()};$('prev').onclick=()=>{if(final)return;teams[active].solved=Math.max(0,teams[active].solved-3);draft=[];save();render()};$('next').onclick=()=>{if(final)return;teams[active].solved=Math.min(questions.length-1,teams[active].solved+3);draft=[];save();render()};$('final').onclick=()=>{if(final)return;const ranks=teams.map((t,i)=>({i,points:t.points})).sort((a,b)=>b.points-a.points||a.i-b.i);ranks.forEach((x,r)=>teams[x.i].pos=r===0?4:r===1?3:r===2?2:1);final=true;draft=[];save();render()};
$('images').onchange=e=>{for(const file of e.target.files){art[file.name]=URL.createObjectURL(file)}$('notice').textContent=Object.keys(art).length+' afbeeldingen geladen';render()};$('audioFile').onchange=e=>{music.src=URL.createObjectURL(e.target.files[0]);$('notice').textContent='Jouw MP3 is geladen'};$('audioToggle').onclick=()=>{if(music.paused){music.play().catch(()=>{$('notice').textContent='Kies eerst jouw MP3-bestand.'});$('audioToggle').textContent='♫ Muziek uit'}else{music.pause();$('audioToggle').textContent='♫ Muziek aan'}};$('volume').oninput=e=>music.volume=+e.target.value/100;
(async()=>{try{const raw=await(await fetch('../game.js')).text();const q=raw.match(/const questions=(\[[\s\S]*?\]);/);const f=raw.match(/const finalQs=(\[[\s\S]*?\]);/);if(!q||!f)throw Error('vragenbank niet gevonden');questions=JSON.parse(q[1]);finalQs=JSON.parse(f[1]);$('notice').textContent='Originele vragenbank geladen: '+questions.length+' oefeningen, '+finalQs.length+' finaleopgaven';try{const d=JSON.parse(localStorage.getItem('machtentempel-art-online'));if(d&&d.teams?.length>=1&&d.teams.length<=13){teams=d.teams;active=Math.min(d.active||0,teams.length-1);final=!!d.final;winner=d.winner??-1}else reset()}catch(e){reset()}render()}catch(e){$('notice').textContent='Kon originele vragen niet laden: '+e.message;console.error(e)}})();
</script></html>
